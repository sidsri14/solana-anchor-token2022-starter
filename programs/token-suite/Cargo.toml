[package]
name = "token-suite"
version = "0.1.0"
description = "Production Solana Anchor 0.30+ Token-2022 Starter Kit"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_suite"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022", "token_2022_extensions"] }
spl-token-2022 = { version = "3.0.4", features = ["no-entrypoint"] }
spl-transfer-hook-interface = { version = "0.6.4" }
spl-tlv-account-resolution = { version = "0.6.4" }
solana-program = "1.18.26"
bytemuck = { version = "1.18.0", features = ["derive"] }
thiserror = "1.0.64"
